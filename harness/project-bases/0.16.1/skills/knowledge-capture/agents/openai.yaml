interface:
  display_name: "Remember useful knowledge (knowledge-capture)"
  short_description: "(knowledge-capture) At the end of a Wiki-enabled turn, keep the useful facts, preferences, or workflows that will help later work, or scan one explicitly selected repository or folder for reviewed knowledge; never save secrets, raw conversations, or uncertain guesses. Formerly knowledge-scan."
  default_prompt: "Automatically review this Wiki-enabled turn and remember each safe durable claim when present, in one write."
policy:
  allow_implicit_invocation: true
