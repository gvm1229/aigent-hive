schema_version = 1
license = "Apache-2.0"

[[paths]]
pattern = ".hive/.gitignore"
ownership = "hive-managed-config"
source = "template"

[[paths]]
pattern = ".hive/LICENSE-AIGENT-HIVE.txt"
ownership = "hive-managed-license"
source = "template"

[[paths]]
pattern = ".hive/README.md"
ownership = "hive-managed-license"
source = "template"

[[paths]]
pattern = ".hive/directives/00-editing-discipline.md"
ownership = "hive-managed-config"
source = "template"

[[paths]]
pattern = ".hive/setup-answers.yml"
ownership = "hive-managed-config"
source = "template"

[[paths]]
pattern = ".hive/config/harness.toml"
ownership = "hive-generated-config"
source = "template"

[[paths]]
pattern = ".hive/config/role-seeds.yml"
ownership = "user-answer-protected"
source = "template"

[[paths]]
pattern = ".hive/config/knowledge-scope.yml"
ownership = "user-answer-protected"
source = "template"

[[paths]]
pattern = ".hive/config/approved-skills.yml"
ownership = "user-consent-protected"
source = "template"

[[paths]]
pattern = ".hive/config/active-skills.yml"
ownership = "hive-generated-config"
source = "compiled-skill-projection"

[[paths]]
pattern = ".hive/config/capability-resolution.yml"
ownership = "hive-generated-config"
source = "read-only-capability-probe"

[[paths]]
pattern = ".hive/config/update-state.json"
ownership = "hive-generated-config"
source = "signed-release-activation"

[[paths]]
pattern = ".hive/config/project-base.json"
ownership = "hive-generated-config"
source = "authenticated-release-projection"

[[paths]]
pattern = ".hive/config/project-overrides.json"
ownership = "hive-generated-config"
source = "local-priority-upgrade"

[[paths]]
pattern = ".hive/config/approved-hooks.yml"
ownership = "user-consent-protected"
source = "conditional-template"

[[paths]]
pattern = ".hive/config/rag-trust.json"
ownership = "canonical-data-protected"
source = "rag-generation-receipt"

[[paths]]
pattern = ".hive/hooks/**"
ownership = "user-consent-protected"
source = "conditional-hook-projection"

[[paths]]
pattern = ".hive/knowledge/**"
ownership = "canonical-data-protected"
source = "template-seed"

[[paths]]
pattern = ".hive/team/**"
ownership = "canonical-data-protected"
source = "template-seed-and-role-materializer"

[[paths]]
pattern = ".hive/runs/**"
ownership = "canonical-data-protected"
source = "template-seed"

[[paths]]
pattern = ".hive/index/**"
ownership = "rebuildable-runtime"

[[paths]]
pattern = ".hive/backups/**"
ownership = "ephemeral-backup"

[[paths]]
pattern = ".hive/runtime/**"
ownership = "ephemeral-runtime"

[[paths]]
pattern = "AGENTS.md"
ownership = "shared-marker"
marker_start = "<!-- AIGENT-HIVE:START -->"
marker_end = "<!-- AIGENT-HIVE:END -->"

[[paths]]
pattern = "CLAUDE.md"
ownership = "shared-marker"
marker_start = "<!-- AIGENT-HIVE:START -->"
marker_end = "<!-- AIGENT-HIVE:END -->"

[[paths]]
pattern = "GEMINI.md"
ownership = "shared-marker"
marker_start = "<!-- AIGENT-HIVE:START -->"
marker_end = "<!-- AIGENT-HIVE:END -->"

[[paths]]
pattern = ".prettierignore"
ownership = "shared-marker"
marker_start = "# AIGENT-HIVE:FORMAT:START"
marker_end = "# AIGENT-HIVE:FORMAT:END"

[[paths]]
pattern = ".agents/directives/*"
ownership = "hive-directive-projection"
source = "release-directive-projection"

[[paths]]
pattern = ".agents/skills/*/SKILL.md"
ownership = "hive-skill-projection"
source = "compiled-skill-projection"

[[paths]]
pattern = ".agents/skills/*/agents/openai.yaml"
ownership = "hive-skill-projection"
source = "compiled-skill-projection"

[[paths]]
pattern = ".claude/skills/*/SKILL.md"
ownership = "hive-skill-projection"
source = "compiled-skill-projection"

[[forbidden_paths]]
pattern = ".omx/**"

[[forbidden_paths]]
pattern = ".omc/**"

[[forbidden_paths]]
pattern = ".codex/**"
