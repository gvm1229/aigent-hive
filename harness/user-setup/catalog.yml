    requires: []
  - skill: setup-project
    requires: []
  - skill: auto-setup-project
    requires:
      - setup-project
  - skill: answer
    requires: []
  - skill: refine-prompt
    requires: []
  - skill: record-knowledge
    requires:
      - search-knowledge
  - skill: search-knowledge
    requires: []
  - skill: share-knowledge
    requires:
      - search-knowledge
      - record-knowledge
  - skill: maintain-knowledge
    requires:
      - search-knowledge
  - skill: save-progress
    requires: []
  - skill: resume-work
    requires:
      - save-progress
  - skill: manage-usage
    requires: []
  - skill: handoff-role
    requires: []
  - skill: verify-package
    requires: []
  - skill: update-hive
    requires: []
  - skill: upgrade-project
    requires:
      - update-hive
  - skill: migrate-project
    requires:
      - update-hive
  - skill: engineer-run
    requires:
      - verify-package
      - handoff-role
      - save-progress
      - resume-work
      - manage-usage
  - skill: manage-wiki
    requires:
      - record-knowledge
      - maintain-knowledge
      - search-knowledge
