schema_version: 1
profiles:
  - id: web-developer
    display_name:
      en: Web development
      ko: 웹 개발
    description:
      en: Background or interest in web applications; it does not select a project workflow
      ko: 웹 애플리케이션 관련 배경 또는 관심사이며 프로젝트 작업 흐름을 정하지 않음
  - id: game-developer
    display_name:
      en: Game development
      ko: 게임 개발
    description:
      en: Background or interest in games; it does not select a project workflow
      ko: 게임 관련 배경 또는 관심사이며 프로젝트 작업 흐름을 정하지 않음
  - id: non-developer
    display_name:
      en: General knowledge work
      ko: 일반 지식 작업
    description:
      en: Background or interest outside software development; it does not select a project workflow
      ko: 소프트웨어 개발 외 배경 또는 관심사이며 프로젝트 작업 흐름을 정하지 않음

personas:
  - id: strict
    display_name:
      en: Strict
      ko: 엄격
    description:
      en: Verification-first execution with narrow assumptions and explicit risk boundaries
      ko: 검증 우선 실행·좁은 가정·명시적 위험 경계
  - id: balanced
    display_name:
      en: Balanced
      ko: 균형
    description:
      en: Practical autonomy with proportionate explanation and verification
      ko: 실용적 자율 실행·적정 설명·검증
  - id: friendly
    display_name:
      en: Friendly
      ko: 친근
    description:
      en: Approachable guidance with clear choices and patient explanation
      ko: 친근한 안내·명확한 선택지·차분한 설명
  - id: custom
    display_name:
      en: Custom persona
      ko: 사용자 정의 페르소나
    description:
      en: User-supplied interaction style without inferred behavior
      ko: 행동 추론 없는 사용자 제공 상호작용 방식

