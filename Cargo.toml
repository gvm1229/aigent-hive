[workspace]
members = [
  "crates/hive-cli",
  "crates/hive-core",
  "crates/hive-projection",
  "crates/hive-render",
  "crates/hive-update",
  "crates/hive-wiki",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
repository = "https://github.com/gvm1229/aigent-hive"
license = "Apache-2.0"

[workspace.metadata.hive]
release-date = "2026-08-23"

[workspace.dependencies]
cap-fs-ext = "=4.0.2"
cap-primitives = "=4.0.2"
cap-std = "=4.0.2"
ed25519-dalek = { version = "=3.0.0", default-features = false }
getrandom = "=0.3.4"
jsonschema = { version = "=0.48.5", default-features = false }
process-wrap = { version = "=9.1.0", default-features = false, features = ["job-object", "process-group", "std"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "serialize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
serde_yaml = { package = "yaml_serde", version = "=0.10.4" }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
toml = "=1.1.3"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "=8.6.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
