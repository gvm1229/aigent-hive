# Canonical Python conformance inventory. Every test_*.py module belongs to
# exactly one lane so a removal, rename, or unclassified addition is visible.

[lanes.documentation]
owner = "documentation"
contract = "human documentation, local verification command, and developer-install guidance"
release_gate = true
modules = [
  "tests.conformance.documentation.test_dev_check",
  "tests.conformance.documentation.test_dev_install_script",
  "tests.conformance.documentation.test_docs_wiki",
  "tests.conformance.documentation.test_human_documentation_style",
  "tests.conformance.documentation.test_markdown_links",
  "tests.conformance.documentation.test_test_lanes",
  "tests.conformance.documentation.test_test_artifacts",
]

[lanes.security]
owner = "platform-safety"
contract = "installed usage guard and hostile ownership boundaries"
release_gate = true
modules = [
  "tests.conformance.security.test_ownership_hostile",
  "tests.conformance.security.test_setup_security",
  "tests.conformance.security.test_usage_guard",
]

[lanes.contract]
owner = "harness-core"
contract = "CLI capabilities, setup schema, Skills, projections, roles, scheduling, and result contracts"
release_gate = true
modules = [
  "tests.conformance.contracts.test_capabilities",
  "tests.conformance.contracts.test_cli_exit_contract",
  "tests.conformance.contracts.test_setup_fixtures",
  "tests.conformance.contracts.test_setup_regressions",
  "tests.conformance.contracts.test_role_projection_parity",
  "tests.conformance.contracts.test_setup",
  "tests.conformance.contracts.test_setup_ownership_gates",
  "tests.conformance.contracts.test_skill_projections",
  "tests.conformance.contracts.test_prompt_refinement",
  "tests.conformance.contracts.test_skill_routing",
  "tests.conformance.contracts.test_static_contracts",
  "tests.conformance.contracts.test_run_role_contracts",
  "tests.conformance.contracts.test_source_draft_devlog",
  "tests.conformance.contracts.test_judge_contracts",
  "tests.conformance.contracts.test_korean_language_core",
  "tests.conformance.contracts.test_usage_control",
  "tests.conformance.contracts.test_vector_feasibility",
  "tests.conformance.contracts.test_vector_requalification",
  "tests.conformance.contracts.test_vector_runtime",
  "tests.conformance.contracts.test_vector_parent",
  "tests.conformance.contracts.test_action_result_contracts",
  "tests.conformance.contracts.test_hive_skills",
  "tests.conformance.contracts.test_host_capabilities",
  "tests.conformance.contracts.test_knowledge_schemas",
  "tests.conformance.contracts.test_knowledge_graph_contracts",
  "tests.conformance.contracts.test_native_orchestration_feasibility",
  "tests.conformance.contracts.test_skill_inventory",
]

[lanes.integration]
owner = "consumer-lifecycle"
contract = "clean user lifecycle, setup preservation, knowledge, project lifecycle, and source Wiki behavior"
release_gate = true
modules = [
  "tests.conformance.integration.test_connected_setup_lifecycle",
  "tests.conformance.integration.test_wiki_lifecycle",
  "tests.conformance.integration.test_project_lifecycle",
  "tests.conformance.integration.test_root_knowledge_promotion",
  "tests.conformance.integration.test_shared_knowledge_index",
  "tests.conformance.integration.test_source_wiki",
  "tests.conformance.integration.test_vector_cli",
  "tests.conformance.integration.test_wiki_cli_e2e",
]

[lanes.release]
owner = "release-engineering"
contract = "package layout, signed update behavior, and public update discovery"
release_gate = true
modules = [
  "tests.conformance.release.test_historical_project_bases",
  "tests.conformance.release.test_project_base_coverage",
  "tests.conformance.release.test_npm_packaging",
  "tests.conformance.release.test_update_migration",
  "tests.conformance.release.test_release_notes",
  "tests.conformance.release.test_public_test_acceptance",
  "tests.conformance.release.test_vector_runtime_acceptance",
  "tests.conformance.release.test_release_qualification_order",
  "tests.conformance.release.test_stable_release_discord_notification",
  "tests.conformance.release.test_stable_skill_ledger",
  "tests.conformance.release.test_update_discovery",
]
