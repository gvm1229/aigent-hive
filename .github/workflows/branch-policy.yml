name: Branch policy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check actual branch names and PR direction
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python scripts/branch-policy.py pr --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --head-repo "$HEAD_REPO" --base-repo "$BASE_REPO"
          else
            python scripts/branch-policy.py check "$BRANCH"
          fi
          python scripts/branch-policy.py ruleset --check
