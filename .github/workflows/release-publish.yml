name: Publish npm test distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact product version
        required: true
        type: string
      candidate_run_id:
        description: Successful Release candidate workflow run id
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish npm test distribution
    environment: release-publication
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      RUN_ID: ${{ inputs.candidate_run_id }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Validate untrusted dispatch inputs
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 2
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            exit 2
          fi
          test "$VERSION" = "0.8.0"
      - name: Resolve the exact successful candidate commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .name <<<"$metadata")" = "Release candidate"
          test "$(jq -r .event <<<"$metadata")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$metadata")" = "main"
          test "$(jq -r .conclusion <<<"$metadata")" = "success"
          echo "sha=$(jq -r .head_sha <<<"$metadata")" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Enforce product version and release notes
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          scripts/check-release-version.sh "$VERSION"
          test -f "docs/releases/$VERSION.md"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify required artifacts, checksums, and GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archives=(
            "aigent-hive-$VERSION-aarch64-apple-darwin.tar.gz"
            "aigent-hive-$VERSION-x86_64-apple-darwin.tar.gz"
            "aigent-hive-$VERSION-aarch64-unknown-linux-musl.tar.gz"
            "aigent-hive-$VERSION-x86_64-unknown-linux-musl.tar.gz"
            "aigent-hive-$VERSION-x86_64-pc-windows-msvc.zip"
          )
          npm_archives=(
            "aigent-hive-darwin-arm64-$VERSION.tgz"
            "aigent-hive-darwin-x64-$VERSION.tgz"
            "aigent-hive-linux-arm64-$VERSION.tgz"
            "aigent-hive-linux-x64-$VERSION.tgz"
            "aigent-hive-win32-x64-$VERSION.tgz"
            "aigent-hive-$VERSION.tgz"
          )
          for archive in "${archives[@]}"; do
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            read -r digest name extra <"dist/$archive.sha256"
            test -z "${extra:-}"
            test "$name" = "$archive"
            test "$digest" = "$(sha256sum "dist/$archive" | cut -d' ' -f1)"
            gh attestation verify "dist/$archive" --repo "$GITHUB_REPOSITORY"
          done
          for archive in "${npm_archives[@]}"; do
            test -f "dist/$archive"
            gh attestation verify "dist/$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: Verify npm manifests and native binary byte identity
        run: |
          verify_package() {
            archive=$1
            expected_name=$2
            manifest=$(tar -xOf "$archive" package/package.json)
            test "$(jq -r .name <<<"$manifest")" = "$expected_name"
            test "$(jq -r .version <<<"$manifest")" = "$VERSION"
            test "$(jq -r '.scripts // empty' <<<"$manifest")" = ""
          }
          verify_identity() {
            native_archive=$1
            npm_archive=$2
            executable=$3
            root=$(mktemp -d)
            mkdir "$root/native" "$root/npm"
            case "$native_archive" in
              *.zip) unzip -q "$native_archive" -d "$root/native" ;;
              *.tar.gz) tar -xzf "$native_archive" -C "$root/native" ;;
              *) exit 4 ;;
            esac
            tar -xzf "$npm_archive" -C "$root/npm"
            if [[ "$native_archive" = *.zip ]]; then
              cmp "$root/native/$executable" "$root/npm/package/bin/$executable"
            else
              mapfile -t native_directories < <(
                find "$root/native" -mindepth 1 -maxdepth 1 -type d
              )
              test "${#native_directories[@]}" -eq 1
              cmp "${native_directories[0]}/$executable" \
                "$root/npm/package/bin/$executable"
            fi
          }
          verify_package "dist/aigent-hive-darwin-arm64-$VERSION.tgz" \
            "@aigent-hive/darwin-arm64"
          verify_package "dist/aigent-hive-darwin-x64-$VERSION.tgz" \
            "@aigent-hive/darwin-x64"
          verify_package "dist/aigent-hive-linux-arm64-$VERSION.tgz" \
            "@aigent-hive/linux-arm64"
          verify_package "dist/aigent-hive-linux-x64-$VERSION.tgz" \
            "@aigent-hive/linux-x64"
          verify_package "dist/aigent-hive-win32-x64-$VERSION.tgz" \
            "@aigent-hive/win32-x64"
          verify_package "dist/aigent-hive-$VERSION.tgz" "aigent-hive"
          umbrella=$(tar -xOf "dist/aigent-hive-$VERSION.tgz" package/package.json)
          test "$(jq -r '.optionalDependencies | length' <<<"$umbrella")" = 5
          test "$(jq -r --arg version "$VERSION" \
            '[.optionalDependencies[] == $version] | all' <<<"$umbrella")" = true
          for installer in install.sh install.ps1 install.cmd; do
            tar -xOf "dist/aigent-hive-$VERSION.tgz" \
              "package/$installer" >"dist/$installer"
          done
          chmod 0755 dist/install.sh
          if grep -ER '__AIGENT_HIVE_[A-Z0-9_]+__' \
            dist/install.sh dist/install.ps1 dist/install.cmd; then
            exit 5
          fi
          grep -F "registry.npmjs.org/@aigent-hive/" dist/install.sh
          grep -F "registry.npmjs.org/@aigent-hive/" dist/install.ps1
          grep -F "unpkg.com/aigent-hive@$VERSION/install.ps1" dist/install.cmd
          verify_identity \
            "dist/aigent-hive-$VERSION-aarch64-apple-darwin.tar.gz" \
            "dist/aigent-hive-darwin-arm64-$VERSION.tgz" hive
          verify_identity \
            "dist/aigent-hive-$VERSION-x86_64-apple-darwin.tar.gz" \
            "dist/aigent-hive-darwin-x64-$VERSION.tgz" hive
          verify_identity \
            "dist/aigent-hive-$VERSION-aarch64-unknown-linux-musl.tar.gz" \
            "dist/aigent-hive-linux-arm64-$VERSION.tgz" hive
          verify_identity \
            "dist/aigent-hive-$VERSION-x86_64-unknown-linux-musl.tar.gz" \
            "dist/aigent-hive-linux-x64-$VERSION.tgz" hive
          verify_identity \
            "dist/aigent-hive-$VERSION-x86_64-pc-windows-msvc.zip" \
            "dist/aigent-hive-win32-x64-$VERSION.tgz" hive.exe
      - name: Refuse existing npm versions
        run: |
          packages=(
            "@aigent-hive/darwin-arm64"
            "@aigent-hive/darwin-x64"
            "@aigent-hive/linux-arm64"
            "@aigent-hive/linux-x64"
            "@aigent-hive/win32-x64"
            "aigent-hive"
          )
          for package in "${packages[@]}"; do
            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION already exists" >&2
              exit 3
            fi
          done
      - name: Publish npm platform packages and umbrella under test
        run: |
          npm publish "dist/aigent-hive-darwin-arm64-$VERSION.tgz" \
            --access public --provenance --tag test
          npm publish "dist/aigent-hive-darwin-x64-$VERSION.tgz" \
            --access public --provenance --tag test
          npm publish "dist/aigent-hive-linux-arm64-$VERSION.tgz" \
            --access public --provenance --tag test
          npm publish "dist/aigent-hive-linux-x64-$VERSION.tgz" \
            --access public --provenance --tag test
          npm publish "dist/aigent-hive-win32-x64-$VERSION.tgz" \
            --access public --provenance --tag test
          npm publish "dist/aigent-hive-$VERSION.tgz" \
            --access public --provenance --tag test
