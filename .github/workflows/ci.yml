name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify tracked change risk
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "scope=product" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          if [[ -z "$base" ]]; then
            echo "scope=product" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          if ((${#changed[@]} == 0)); then
            echo "scope=product" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != *.md && "$path" != docs/*.html && "$path" != .github/workflows/ci.yml ]]; then
              echo "scope=product" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "scope=documentation" >>"$GITHUB_OUTPUT"

  documentation:
    name: Documentation-only conformance
    needs: changes
    if: needs.changes.outputs.scope == 'documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-conformance.txt
      - run: python scripts/test-artifacts.py run --purpose 'CI 문서 lane' --path target/debug --command python scripts/test-lanes.py --lane documentation

  rust:
    name: Rust (Linux full)
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python scripts/test-artifacts.py run --purpose 'CI Rust 전체 단위 시험' --path target/debug --command cargo test --workspace --all-targets --all-features --locked

  conformance:
    name: Conformance (Linux · ${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - documentation
          - security
          - contract
          - integration
          - release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - name: Install pinned conformance dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Build conformance CLI
        run: cargo build --bin hive --all-features --locked
      - name: Select Linux CLI path
        run: echo "HIVE_BIN=$GITHUB_WORKSPACE/target/debug/hive" >> "$GITHUB_ENV"
      - name: Run complete named conformance inventory
        run: python scripts/test-artifacts.py run --purpose "CI conformance ${{ matrix.lane }} lane" --path target/debug --command python scripts/test-lanes.py --lane ${{ matrix.lane }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ matrix.lane }}
          path: tests/results/runs/*.md
          if-no-files-found: warn

  copier:
    name: Contract and Copier conformance
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - name: Install authoring and validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Render default fixture for every host
        run: |
          for host in codex claude antigravity; do
            copier copy --trust --defaults \
              --data-file tests/fixtures/setup/copier-default-data.yml \
              --data "primary_host=${host}" \
              . "tests/work/copier-default-${host}"
          done
      - name: Render hostile-string and typed-answer fixture
        run: >-
          copier copy --trust --defaults
          --data-file tests/fixtures/setup/copier-hostile-data.yml
          . tests/work/copier-hostile
      - name: Reject fallback hooks without a supported host-native event
        run: |
          for detection in absent incompatible unknown; do
            if copier copy --trust --defaults \
              --data-file tests/fixtures/setup/copier-hostile-data.yml \
              --data "capability_resolution={\"host\":\"claude\",\"detection\":\"${detection}\"}" \
              . "tests/work/copier-invalid-hooks-${detection}" \
              >"tests/work/copier-invalid-hooks-${detection}.log" 2>&1; then
              exit 1
            fi
            grep -q "optional hook은 available host-native surface의 정확한 supported event에서만 승인할 수 있습니다" \
              "tests/work/copier-invalid-hooks-${detection}.log"
            test ! -e "tests/work/copier-invalid-hooks-${detection}/.hive/setup-answers.yml"
          done
      - name: Validate schema and rendered fixtures
        run: |
          for host in codex claude antigravity; do
            python tests/validate_scaffold.py \
              "tests/work/copier-default-${host}" \
              tests/fixtures/setup/copier-default-data.yml
          done
          python tests/validate_scaffold.py \
            tests/work/copier-hostile \
            tests/fixtures/setup/copier-hostile-data.yml
      - name: Enforce human documentation style contract
        run: |
          python -m unittest tests.conformance.documentation.test_human_documentation_style -v
          python -m unittest tests.conformance.documentation.test_markdown_links -v
          python scripts/check-human-documentation-style.py --all --output json
          python scripts/check-markdown-links.py --output json
          python scripts/check-public-stable-docs.py --output json

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - run: python scripts/test-artifacts.py run --purpose '플랫폼 Hive CLI 단위 시험' --path target/debug --command cargo test -p hive-cli --locked

  transfer-produce:
    name: Transfer producer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/debug/hive.exe
          - os: macos-latest
            binary: target/debug/hive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - run: python scripts/test-artifacts.py run --purpose '교차 운영체제 이전 바이너리' --path target/debug --command cargo build -p hive-cli --locked
      - run: python scripts/test-artifacts.py run --purpose '운영체제 간 여러 묶음 통합 자료 생성' --path tests/work/transfer-producer --command python scripts/qualify-knowledge-transfer.py produce --multi --hive ${{ matrix.binary }} --work tests/work/transfer-producer
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: transfer-${{ matrix.os }}
          path: |
            tests/work/transfer-producer/portable-a.hivekb
            tests/work/transfer-producer/portable-b.hivekb
            tests/work/transfer-producer/expected.json
            tests/work/transfer-producer/receipt.json
          if-no-files-found: error

  transfer-consume:
    name: Transfer ${{ matrix.producer }} to ${{ matrix.os }}
    needs: transfer-produce
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            producer: windows-latest
            binary: target/debug/hive
          - os: ubuntu-latest
            producer: windows-latest
            binary: target/debug/hive
          - os: windows-latest
            producer: macos-latest
            binary: target/debug/hive.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: transfer-${{ matrix.producer }}
          path: tests/work/transfer-input
      - run: python scripts/test-artifacts.py run --purpose '이전 수신 바이너리' --path target/debug --command cargo build -p hive-cli --locked
      - run: python scripts/test-artifacts.py run --purpose '다른 운영체제의 여러 묶음 통합 복원' --path tests/work/transfer-consumer --command python scripts/qualify-knowledge-transfer.py consume --multi --hive ${{ matrix.binary }} --work tests/work/transfer-consumer --input tests/work/transfer-input --require-cross-os
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: transfer-results-${{ matrix.producer }}-to-${{ matrix.os }}
          path: |
            tests/work/transfer-consumer/receipt.json
            tests/results/runs/*.md

  protected-merge-gate:
    name: Protected merge gate
    if: always()
    needs:
      - changes
      - documentation
      - rust
      - conformance
      - copier
      - platform-smoke
      - transfer-consume
    runs-on: ubuntu-latest
    env:
      SCOPE: ${{ needs.changes.outputs.scope }}
      DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      CONFORMANCE_RESULT: ${{ needs.conformance.result }}
      COPIER_RESULT: ${{ needs.copier.result }}
      PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
      TRANSFER_RESULT: ${{ needs.transfer-consume.result }}
    steps:
      - name: Require the risk-matched verification result
        shell: bash
        run: |
          case "$SCOPE" in
            documentation)
              test "$DOCUMENTATION_RESULT" = success
              ;;
            product)
              test "$RUST_RESULT" = success
              test "$CONFORMANCE_RESULT" = success
              test "$COPIER_RESULT" = success
              test "$PLATFORM_RESULT" = success
              test "$TRANSFER_RESULT" = success
              ;;
            *)
              exit 2
              ;;
          esac
