name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked

  conformance:
    name: Conformance (${{ matrix.os }} · ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        lane:
          - documentation
          - security
          - contract
          - integration
          - release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned conformance dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Build conformance CLI
        run: cargo build --bin hive --all-features --locked
      - name: Select platform CLI path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "HIVE_BIN=$GITHUB_WORKSPACE/target/debug/hive.exe" >> "$GITHUB_ENV"
          else
            echo "HIVE_BIN=$GITHUB_WORKSPACE/target/debug/hive" >> "$GITHUB_ENV"
          fi
      - name: Run source usage-guard conformance corpus
        if: matrix.lane == 'security' && runner.os != 'Windows'
        run: >-
          python -m unittest
          tests.conformance.test_source_usage_guard
          -v
      - name: Run Windows source usage-guard compatibility regressions
        if: matrix.lane == 'security' && runner.os == 'Windows'
        run: >-
          python -m unittest
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_write_json_skips_unavailable_fchmod
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_write_json_closes_descriptor_before_failed_write_cleanup
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_windows_watcher_lease_read_skips_locked_first_byte
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_gate_allows_clean_clone_without_omx_state
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_session_disable_requires_confirmation
          tests.conformance.test_source_usage_guard.SourceUsageGuardTests.test_disabled_gate_does_not_initialize_quota_sensor
          -v
      - name: Run complete named conformance inventory
        run: python scripts/test-lanes.py --lane ${{ matrix.lane }}
        env:
          HIVE_WINDOWS_SOURCE_USAGE_GUARD_SUBSET: skip

  copier:
    name: Contract and Copier conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install authoring and validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Render default fixture for every host
        run: |
          for host in codex claude antigravity; do
            copier copy --trust --defaults \
              --data-file tests/fixtures/copier-default-data.yml \
              --data "primary_host=${host}" \
              . "tests/work/copier-default-${host}"
          done
      - name: Render hostile-string and typed-answer fixture
        run: >-
          copier copy --trust --defaults
          --data-file tests/fixtures/copier-hostile-data.yml
          . tests/work/copier-hostile
      - name: Reject fallback hooks without a supported host-native event
        run: |
          for detection in absent incompatible unknown; do
            if copier copy --trust --defaults \
              --data-file tests/fixtures/copier-hostile-data.yml \
              --data "capability_resolution={\"host\":\"claude\",\"detection\":\"${detection}\"}" \
              . "tests/work/copier-invalid-hooks-${detection}" \
              >"tests/work/copier-invalid-hooks-${detection}.log" 2>&1; then
              exit 1
            fi
            grep -q "optional hook은 available host-native surface의 정확한 supported event에서만 승인할 수 있습니다" \
              "tests/work/copier-invalid-hooks-${detection}.log"
            test ! -e "tests/work/copier-invalid-hooks-${detection}/.hive/setup-answers.yml"
          done
      - name: Validate schema and rendered fixtures
        run: |
          for host in codex claude antigravity; do
            python tests/validate_scaffold.py \
              "tests/work/copier-default-${host}" \
              tests/fixtures/copier-default-data.yml
          done
          python tests/validate_scaffold.py \
            tests/work/copier-hostile \
            tests/fixtures/copier-hostile-data.yml
      - name: Enforce human documentation style contract
        run: |
          python -m unittest tests.conformance.test_source_usage_guard -v
          python -m unittest tests.conformance.test_human_documentation_style -v
          python -m unittest tests.conformance.test_markdown_links -v
          python scripts/check-human-documentation-style.py --all --output json
          python scripts/check-markdown-links.py --output json
