name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify tracked change risk
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "scope=product" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          if ((${#changed[@]} == 0)); then
            echo "scope=product" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != *.md && "$path" != docs/*.html ]]; then
              echo "scope=product" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "scope=documentation" >>"$GITHUB_OUTPUT"

  documentation:
    name: Documentation-only conformance
    needs: changes
    if: needs.changes.outputs.scope == 'documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-conformance.txt
      - run: python scripts/test-lanes.py --lane documentation

  rust:
    name: Rust (Linux full)
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked

  conformance:
    name: Conformance (Linux · ${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - documentation
          - security
          - contract
          - integration
          - release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - name: Install pinned conformance dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Build conformance CLI
        run: cargo build --bin hive --all-features --locked
      - name: Select Linux CLI path
        run: echo "HIVE_BIN=$GITHUB_WORKSPACE/target/debug/hive" >> "$GITHUB_ENV"
      - name: Run complete named conformance inventory
        run: python scripts/test-lanes.py --lane ${{ matrix.lane }}

  copier:
    name: Contract and Copier conformance
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - name: Install authoring and validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-conformance.txt
      - name: Render default fixture for every host
        run: |
          for host in codex claude antigravity; do
            copier copy --trust --defaults \
              --data-file tests/fixtures/copier-default-data.yml \
              --data "primary_host=${host}" \
              . "tests/work/copier-default-${host}"
          done
      - name: Render hostile-string and typed-answer fixture
        run: >-
          copier copy --trust --defaults
          --data-file tests/fixtures/copier-hostile-data.yml
          . tests/work/copier-hostile
      - name: Reject fallback hooks without a supported host-native event
        run: |
          for detection in absent incompatible unknown; do
            if copier copy --trust --defaults \
              --data-file tests/fixtures/copier-hostile-data.yml \
              --data "capability_resolution={\"host\":\"claude\",\"detection\":\"${detection}\"}" \
              . "tests/work/copier-invalid-hooks-${detection}" \
              >"tests/work/copier-invalid-hooks-${detection}.log" 2>&1; then
              exit 1
            fi
            grep -q "optional hook은 available host-native surface의 정확한 supported event에서만 승인할 수 있습니다" \
              "tests/work/copier-invalid-hooks-${detection}.log"
            test ! -e "tests/work/copier-invalid-hooks-${detection}/.hive/setup-answers.yml"
          done
      - name: Validate schema and rendered fixtures
        run: |
          for host in codex claude antigravity; do
            python tests/validate_scaffold.py \
              "tests/work/copier-default-${host}" \
              tests/fixtures/copier-default-data.yml
          done
          python tests/validate_scaffold.py \
            tests/work/copier-hostile \
            tests/fixtures/copier-hostile-data.yml
      - name: Enforce human documentation style contract
        run: |
          python -m unittest tests.conformance.test_human_documentation_style -v
          python -m unittest tests.conformance.test_markdown_links -v
          python scripts/check-human-documentation-style.py --all --output json
          python scripts/check-markdown-links.py --output json

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
      - run: cargo test -p hive-cli --locked

  protected-merge-gate:
    name: Protected merge gate
    if: always()
    needs:
      - changes
      - documentation
      - rust
      - conformance
      - copier
      - platform-smoke
    runs-on: ubuntu-latest
    env:
      SCOPE: ${{ needs.changes.outputs.scope }}
      DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      CONFORMANCE_RESULT: ${{ needs.conformance.result }}
      COPIER_RESULT: ${{ needs.copier.result }}
      PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
    steps:
      - name: Require the risk-matched verification result
        shell: bash
        run: |
          case "$SCOPE" in
            documentation)
              test "$DOCUMENTATION_RESULT" = success
              ;;
            product)
              test "$RUST_RESULT" = success
              test "$CONFORMANCE_RESULT" = success
              test "$COPIER_RESULT" = success
              test "$PLATFORM_RESULT" = success
              ;;
            *)
              exit 2
              ;;
          esac
