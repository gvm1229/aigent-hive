name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  copier:
    name: Contract and Copier conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install authoring and validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          copier==9.17.0
          jsonschema[format]==4.25.1
          PyYAML==6.0.2
      - name: Render default fixture
        run: >-
          copier copy --trust --defaults
          --data-file tests/fixtures/copier-default-data.yml
          . tests/work/copier-default
      - name: Render hostile-string and typed-answer fixture
        run: >-
          copier copy --trust --defaults
          --data-file tests/fixtures/copier-hostile-data.yml
          . tests/work/copier-hostile
      - name: Reject invalid host and orchestration pair
        run: |
          if copier copy --trust --defaults \
            --data project_name=invalid \
            --data primary_host=codex \
            --data orchestration_layer=omc \
            . tests/work/copier-invalid >tests/work/copier-invalid.log 2>&1; then
            exit 1
          fi
          grep -q "OMC는 Claude Code에서만 선택할 수 있습니다" \
            tests/work/copier-invalid.log
      - name: Validate schema and rendered fixtures
        run: |
          python tests/validate_scaffold.py \
            tests/work/copier-default \
            tests/fixtures/copier-default-data.yml
          python tests/validate_scaffold.py \
            tests/work/copier-hostile \
            tests/fixtures/copier-hostile-data.yml
