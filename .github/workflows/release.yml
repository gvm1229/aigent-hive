name: Release candidate

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: Exact product version already present in source
        required: true
        type: string
      package_version:
        description: "Exact npm package version: X.Y.Z, X.Y.Z-test, or X.Y.Z-test.N"
        required: true
        type: string
      channel:
        description: Candidate channel; test builds only develop and stable builds only main
        required: true
        type: choice
        options:
          - test
          - stable
      release_date:
        description: Exact package release date embedded in the shipped CLI (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      PRODUCT_VERSION: ${{ inputs.product_version }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CHANNEL: ${{ inputs.channel }}
      PACKAGE_RELEASE_DATE: ${{ inputs.release_date }}
      TARGET: ${{ matrix.target }}
      PLATFORM_PACKAGE: ${{ matrix.platform_package }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform_package: darwin-arm64
          - label: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform_package: darwin-x64
          - label: Linux x86_64 musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform_package: linux-x64
          - label: Linux arm64 musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform_package: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce exact channel-bound candidate source
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_REF_NAME: ${{ github.ref_name }}
          CANDIDATE_REF_TYPE: ${{ github.ref_type }}
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          case "$CHANNEL" in
            test)
              expected_ref=develop
              case "$PACKAGE_VERSION" in
                "$PRODUCT_VERSION"-test) ;;
                "$PRODUCT_VERSION"-test.[1-9]*)
                  [[ "${PACKAGE_VERSION#"$PRODUCT_VERSION-test."}" =~ ^[1-9][0-9]*$ ]]
                  ;;
                *) exit 2 ;;
              esac
              ;;
            stable)
              expected_ref=main
              test "$PACKAGE_VERSION" = "$PRODUCT_VERSION"
              ;;
            *) exit 2 ;;
          esac
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$PACKAGE_RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$CANDIDATE_REF" = "refs/heads/$expected_ref"
          test "$CANDIDATE_REF_NAME" = "$expected_ref"
          test "$CANDIDATE_REF_TYPE" = "branch"
          test "$CANDIDATE_SHA" = "$WORKFLOW_SHA"
          test "$CANDIDATE_SHA" = "$(git rev-parse refs/remotes/origin/$expected_ref)"
      - name: Install the native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enforce source version and build locked native binary
        run: |
          scripts/check-release-version.sh "$PRODUCT_VERSION"
          AIGENT_HIVE_PACKAGE_VERSION="$PACKAGE_VERSION" \
            AIGENT_HIVE_PACKAGE_RELEASE_DATE="$PACKAGE_RELEASE_DATE" \
            cargo build --release --locked --target "$TARGET" --bin hive
      - name: Apply and verify explicit macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          binary="target/$TARGET/release/hive"
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          details=$(codesign --display --verbose=4 "$binary" 2>&1)
          grep -F "Signature=adhoc" <<<"$details"
          grep -F "TeamIdentifier=not set" <<<"$details"
      - name: Verify native architecture and runtime
        run: |
          binary="target/$TARGET/release/hive"
          file "$binary"
          case "$TARGET" in
            aarch64-apple-darwin)
              test "$(lipo -archs "$binary")" = arm64
              ;;
            x86_64-apple-darwin)
              test "$(lipo -archs "$binary")" = x86_64
              ;;
            *-unknown-linux-musl)
              file "$binary" | grep -F "ELF 64-bit"
              file "$binary" | grep -E "statically linked|static-pie linked"
              ;;
            *)
              exit 4
              ;;
          esac
          case "$PACKAGE_VERSION" in
            "$PRODUCT_VERSION")
              expected_version="AIgent Hive v$PRODUCT_VERSION (released $PACKAGE_RELEASE_DATE)"
              ;;
            "$PRODUCT_VERSION"-test)
              expected_version="AIgent Hive v$PRODUCT_VERSION-test · developer test build (released $PACKAGE_RELEASE_DATE)"
              ;;
            "$PRODUCT_VERSION"-test.*)
              revision=${PACKAGE_VERSION#"$PRODUCT_VERSION-test."}
              expected_version="AIgent Hive v$PRODUCT_VERSION-test #$revision · developer test build (released $PACKAGE_RELEASE_DATE)"
              ;;
            *) exit 4 ;;
          esac
          test "$("$binary" --version)" = "$expected_version"
          "$binary" doctor | grep -F "aigent-hive $PRODUCT_VERSION"
      - name: Package native archive and npm platform package
        run: |
          package="aigent-hive-$PRODUCT_VERSION-$TARGET"
          mkdir "$package"
          cp "target/$TARGET/release/hive" "$package/hive"
          cp LICENSE "$package/LICENSE"
          if [ "$RUNNER_OS" = macOS ]; then
            COPYFILE_DISABLE=1 tar --format ustar --uid 0 --gid 0 \
              -cf - "$package/hive" "$package/LICENSE" | gzip -n >"$package.tar.gz"
            archive_digest=$(shasum -a 256 "$package.tar.gz" | cut -d' ' -f1)
          else
            tar --format ustar --owner 0 --group 0 \
              -cf - "$package/hive" "$package/LICENSE" | gzip -n >"$package.tar.gz"
            archive_digest=$(sha256sum "$package.tar.gz" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$archive_digest" "$package.tar.gz" \
            >"$package.tar.gz.sha256"
          npm_directory=$(node scripts/package-npm.mjs platform \
            --product-version "$PRODUCT_VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --target "$TARGET" \
            --binary "target/$TARGET/release/hive" \
            --output "$RUNNER_TEMP/npm")
          npm_result=$(cd "$npm_directory" && npm pack --json \
            --pack-destination "$GITHUB_WORKSPACE")
          npm_archive=$(printf '%s' "$npm_result" | jq -er '.[0].filename')
          test "$npm_archive" = "aigent-hive-$PLATFORM_PACKAGE-$PACKAGE_VERSION.tgz"
      - name: Generate GitHub artifact attestations
        id: attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: |
            aigent-hive-${{ env.PRODUCT_VERSION }}-${{ matrix.target }}.tar.gz
            aigent-hive-${{ matrix.platform_package }}-${{ env.PACKAGE_VERSION }}.tgz
      - name: Preserve candidate attestation bundle
        run: |
          cp "${{ steps.attestation.outputs.bundle-path }}" \
            "aigent-hive-$PRODUCT_VERSION-$TARGET.attestation.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            aigent-hive-${{ env.PRODUCT_VERSION }}-${{ matrix.target }}.tar.gz
            aigent-hive-${{ env.PRODUCT_VERSION }}-${{ matrix.target }}.tar.gz.sha256
            aigent-hive-${{ matrix.platform_package }}-${{ env.PACKAGE_VERSION }}.tgz
            aigent-hive-${{ env.PRODUCT_VERSION }}-${{ matrix.target }}.attestation.jsonl
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    env:
      PRODUCT_VERSION: ${{ inputs.product_version }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CHANNEL: ${{ inputs.channel }}
      PACKAGE_RELEASE_DATE: ${{ inputs.release_date }}
      TARGET: x86_64-pc-windows-msvc
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce exact channel-bound candidate source
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_REF_NAME: ${{ github.ref_name }}
          CANDIDATE_REF_TYPE: ${{ github.ref_type }}
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          case "$CHANNEL" in
            test)
              expected_ref=develop
              case "$PACKAGE_VERSION" in
                "$PRODUCT_VERSION"-test) ;;
                "$PRODUCT_VERSION"-test.[1-9]*)
                  [[ "${PACKAGE_VERSION#"$PRODUCT_VERSION-test."}" =~ ^[1-9][0-9]*$ ]]
                  ;;
                *) exit 2 ;;
              esac
              ;;
            stable)
              expected_ref=main
              test "$PACKAGE_VERSION" = "$PRODUCT_VERSION"
              ;;
            *) exit 2 ;;
          esac
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$PACKAGE_RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$CANDIDATE_REF" = "refs/heads/$expected_ref"
          test "$CANDIDATE_REF_NAME" = "$expected_ref"
          test "$CANDIDATE_REF_TYPE" = "branch"
          test "$CANDIDATE_SHA" = "$WORKFLOW_SHA"
          test "$CANDIDATE_SHA" = "$(git rev-parse refs/remotes/origin/$expected_ref)"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enforce source version and build locked native binary
        shell: bash
        run: |
          scripts/check-release-version.sh "$PRODUCT_VERSION"
          AIGENT_HIVE_PACKAGE_VERSION="$PACKAGE_VERSION" \
            AIGENT_HIVE_PACKAGE_RELEASE_DATE="$PACKAGE_RELEASE_DATE" \
            cargo build --release --locked --target "$TARGET" --bin hive
      - name: Verify architecture and package native archive
        shell: pwsh
        run: |
          $binary = "target\$env:TARGET\release\hive.exe"
          $bytes = [IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw "release binary is not x86_64 PE"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::NotSigned) {
            throw "cost-waived Windows release must be explicitly unsigned"
          }
          if ($env:PACKAGE_VERSION -eq $env:PRODUCT_VERSION) {
            $expectedVersion = "AIgent Hive v$($env:PRODUCT_VERSION) (released $env:PACKAGE_RELEASE_DATE)"
          } elseif ($env:PACKAGE_VERSION -eq "$($env:PRODUCT_VERSION)-test") {
            $expectedVersion = "AIgent Hive v$($env:PRODUCT_VERSION)-test · developer test build (released $env:PACKAGE_RELEASE_DATE)"
          } else {
            $revision = $env:PACKAGE_VERSION.Substring(("$($env:PRODUCT_VERSION)-test.").Length)
            $expectedVersion = "AIgent Hive v$($env:PRODUCT_VERSION)-test #$revision · developer test build (released $env:PACKAGE_RELEASE_DATE)"
          }
          if ((& $binary --version) -ne $expectedVersion) {
            throw "release binary version mismatch"
          }
          $package = "aigent-hive-$env:PRODUCT_VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item $binary "$package\hive.exe"
          Copy-Item LICENSE "$package\LICENSE"
          Compress-Archive -Path "$package\*" -DestinationPath "$package.zip"
          $digest = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $package.zip" | Set-Content "$package.zip.sha256" -Encoding ascii
      - name: Package npm platform package
        shell: pwsh
        run: |
          $npmDirectory = node scripts/package-npm.mjs platform `
            --product-version $env:PRODUCT_VERSION `
            --package-version $env:PACKAGE_VERSION `
            --target $env:TARGET `
            --binary "target\$env:TARGET\release\hive.exe" `
            --output "$env:RUNNER_TEMP\npm"
          Push-Location $npmDirectory
          try {
            $npmResult = npm pack --json `
              --pack-destination $env:GITHUB_WORKSPACE | ConvertFrom-Json
          } finally {
            Pop-Location
          }
          $npmArchive = $npmResult[0].filename
          if ($npmArchive -ne "aigent-hive-win32-x64-$env:PACKAGE_VERSION.tgz") {
            throw "unexpected npm platform archive name"
          }
      - name: Generate GitHub artifact attestations
        id: attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: |
            aigent-hive-${{ env.PRODUCT_VERSION }}-x86_64-pc-windows-msvc.zip
            aigent-hive-win32-x64-${{ env.PACKAGE_VERSION }}.tgz
      - name: Preserve candidate attestation bundle
        shell: pwsh
        run: >-
          Copy-Item "${{ steps.attestation.outputs.bundle-path }}"
          "aigent-hive-$env:PRODUCT_VERSION-$env:TARGET.attestation.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            aigent-hive-${{ env.PRODUCT_VERSION }}-x86_64-pc-windows-msvc.zip
            aigent-hive-${{ env.PRODUCT_VERSION }}-x86_64-pc-windows-msvc.zip.sha256
            aigent-hive-win32-x64-${{ env.PACKAGE_VERSION }}.tgz
            aigent-hive-${{ env.PRODUCT_VERSION }}-x86_64-pc-windows-msvc.attestation.jsonl
          if-no-files-found: error

  npm-umbrella:
    name: npm umbrella and direct installers
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    env:
      PRODUCT_VERSION: ${{ inputs.product_version }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CHANNEL: ${{ inputs.channel }}
      PACKAGE_RELEASE_DATE: ${{ inputs.release_date }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce exact channel-bound candidate source
        env:
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_REF_NAME: ${{ github.ref_name }}
          CANDIDATE_REF_TYPE: ${{ github.ref_type }}
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          case "$CHANNEL" in
            test)
              expected_ref=develop
              case "$PACKAGE_VERSION" in
                "$PRODUCT_VERSION"-test) ;;
                "$PRODUCT_VERSION"-test.[1-9]*)
                  [[ "${PACKAGE_VERSION#"$PRODUCT_VERSION-test."}" =~ ^[1-9][0-9]*$ ]]
                  ;;
                *) exit 2 ;;
              esac
              ;;
            stable)
              expected_ref=main
              test "$PACKAGE_VERSION" = "$PRODUCT_VERSION"
              ;;
            *) exit 2 ;;
          esac
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$PACKAGE_RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$CANDIDATE_REF" = "refs/heads/$expected_ref"
          test "$CANDIDATE_REF_NAME" = "$expected_ref"
          test "$CANDIDATE_REF_TYPE" = "branch"
          test "$CANDIDATE_SHA" = "$WORKFLOW_SHA"
          test "$CANDIDATE_SHA" = "$(git rev-parse refs/remotes/origin/$expected_ref)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate digest-bound project upgrade coverage report
        run: |
          table="harness/release/$PRODUCT_VERSION/migration-table.json"
          test -f "$table"
          python3 scripts/check-project-base-coverage.py \
            --migration-table "$table" \
            --output release-project-base-coverage.json
      - name: Render digest-pinned npm direct installers
        run: |
          python3 scripts/render-installers.py \
            --product-version "$PRODUCT_VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --dist dist \
            --output "$RUNNER_TEMP/installers"
      - name: Package npm umbrella with direct installers
        run: |
          scripts/check-release-version.sh "$PRODUCT_VERSION"
          npm_directory=$(node scripts/package-npm.mjs umbrella \
            --product-version "$PRODUCT_VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --installer-dir "$RUNNER_TEMP/installers" \
            --output "$RUNNER_TEMP/npm")
          npm_result=$(cd "$npm_directory" && npm pack --json \
            --pack-destination "$GITHUB_WORKSPACE")
          npm_archive=$(printf '%s' "$npm_result" | jq -er '.[0].filename')
          test "$npm_archive" = "aigent-hive-$PACKAGE_VERSION.tgz"
      - name: Generate GitHub artifact attestation
        id: attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: aigent-hive-${{ env.PACKAGE_VERSION }}.tgz
      - name: Preserve candidate attestation bundle
        run: |
          cp "${{ steps.attestation.outputs.bundle-path }}" \
            "aigent-hive-$PACKAGE_VERSION-npm-umbrella.attestation.jsonl"
      - name: Bind the candidate channel to its exact artifact set
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_REF: ${{ github.ref }}
        run: |
          printf '{"schema_version":1,"channel":"%s","product_version":"%s","package_version":"%s","release_date":"%s","ref":"%s","sha":"%s"}\n' \
            "$CHANNEL" "$PRODUCT_VERSION" "$PACKAGE_VERSION" "$PACKAGE_RELEASE_DATE" "$CANDIDATE_REF" "$CANDIDATE_SHA" \
            >release-candidate.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-npm-umbrella
          path: |
            aigent-hive-${{ env.PACKAGE_VERSION }}.tgz
            aigent-hive-${{ env.PACKAGE_VERSION }}-npm-umbrella.attestation.jsonl
            release-project-base-coverage.json
            release-candidate.json
          if-no-files-found: error

  integrity-bundle:
    name: Stable local integrity bundle
    if: ${{ inputs.channel == 'stable' }}
    needs: [unix, windows, npm-umbrella]
    runs-on: ubuntu-24.04
    env:
      PRODUCT_VERSION: ${{ inputs.product_version }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_REF: ${{ github.ref }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare candidate-bound local integrity bundle
        run: |
          python3 scripts/prepare-release-integrity.py \
            --product-version "$PRODUCT_VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --candidate-sha "$CANDIDATE_SHA" \
            --candidate-run-id "$GITHUB_RUN_ID" \
            --candidate-ref "$CANDIDATE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --dist dist \
            --output "$RUNNER_TEMP/release-bundle"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -C "$RUNNER_TEMP/release-bundle" -cf - \
            bundle-manifest.json targets \
            | gzip -n >"aigent-hive-$PRODUCT_VERSION-release-bundle.tar.gz"
          sha256sum "aigent-hive-$PRODUCT_VERSION-release-bundle.tar.gz" \
            >"aigent-hive-$PRODUCT_VERSION-release-bundle.tar.gz.sha256"
      - name: Generate integrity bundle attestation
        id: integrity-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: aigent-hive-${{ env.PRODUCT_VERSION }}-release-bundle.tar.gz
      - name: Preserve integrity bundle attestation
        run: |
          cp "${{ steps.integrity-attestation.outputs.bundle-path }}" \
            "aigent-hive-$PRODUCT_VERSION-release-bundle.attestation.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-integrity-bundle
          path: |
            aigent-hive-${{ env.PRODUCT_VERSION }}-release-bundle.tar.gz
            aigent-hive-${{ env.PRODUCT_VERSION }}-release-bundle.tar.gz.sha256
            aigent-hive-${{ env.PRODUCT_VERSION }}-release-bundle.attestation.jsonl
          if-no-files-found: error
