[package]
name = "hive-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hive"
path = "src/main.rs"

[features]
notion-preview = []

[dependencies]
base64.workspace = true
cap-fs-ext.workspace = true
cap-primitives.workspace = true
cap-std.workspace = true
getrandom.workspace = true
hive-core = { path = "../hive-core" }
hive-projection = { path = "../hive-projection" }
hive-render = { path = "../hive-render" }
hive-update = { path = "../hive-update" }
hive-wiki = { path = "../hive-wiki" }
jsonschema.workspace = true
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_yaml.workspace = true
toml.workspace = true
ureq.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
libproc = "=0.14.11"
security-framework = "=3.7.0"
sysctl = "=0.7.1"

[dev-dependencies]
ed25519-dalek.workspace = true

[build-dependencies]
sha2.workspace = true
toml.workspace = true

[lints]
workspace = true
